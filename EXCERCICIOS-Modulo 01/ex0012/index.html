<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Videos com HTML5</title>
</head>
<body>
    <h1>Inserindo videos hospedados no meu localmente</h1>
    <p>Este video está hospedado no meu proprio servidor.</p>
    <video width="500" poster="imagens/limoes-capa.png" controls >
        <source src="videos/meu-video.mp4" width="500" type="video/mp4">
        <source src="videos/meu-video.m4v" type="video/m4v">
        <source src="videos/meu-video.webm" type="video/webm">
        <source src="videos/meu-video.ogv" type="video/ogg">
        <p>Seu navegador não tem compatibilidade com reprodução de vídeos.</p></video>
    
        <h1>Inserindo Videos do Youtube</h1>
      <iframe width="560" height="315" src="https://www.youtube.com/embed/jPWsBuiy1rE?si=Kf-vs02-aLaIuqxp&amp;start=2" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      <h1>Inserindo Videos do Vimeo</h1>
      <iframe src="https://player.vimeo.com/video/840706743?badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" width="560" height="341" frameborder="0" allow="autoplay; fullscreen; picture-in-picture; clipboard-write; encrypted-media; web-share" referrerpolicy="strict-origin-when-cross-origin" title="The Dancing Bees"></iframe>
</body>
</html>
