<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelo de Caixas</title>

<style>

    h1{
      /* box-level*/
        background-color: lightgray;
        height: 300px;
        width: 300px;
        /*

        border-width: 10px;
        border-style: dotted;
        border-color: darkslategray;
        
        simplicado com um unico border, EXEMPLO ABAIXO!*/
       
        border: 10px dotted darkslategray;

     /*padding-top: 10px;
      padding-right: 10px;
      padding-bottom: 10px;
      padding-left: 10px;
      
      Todos esses padding acima foram substituido por um único padding, pós quando você colocar o primeiro valor, automaticamento ele predefine todos os angulos com o valor que você definiu incialmente, EXEMPLO ABAIXO! */
     padding: 10px;

/*  margin-top: 20px;
      margin-right: 20px;
       margin-bottom: 20px;
      margin-left: 20px;
      
      Todos esses margin acima foram substituido por um único margin, pós quando você colocar o primeiro valor, automaticamento ele predefine todos os angulos com o valor que você definiu incialmente, EXEMPLO ABAIXO! */
      margin: 10px;
     
  
      /*  outline-width: 5px;
      outline-style: solid;
      outline-color: rgba(29, 143, 29, 0.616); 
      
      Simplificado com um único outline, EXEMPLO ABAIXO!*/
 
      outline: 5px solid rgba(29, 143, 29, 0.616) ;
    }

    a{ /*INLINE-LEVEL*/

display: block;

        border-width: 10px;
        border-style: solid;
        border-color:red;

        padding-top: 5px;
      padding-right: 10px;
       padding-bottom: 10px;
      padding-left: 10px;
         
    }


</style>


</head>
<body>
    <h1>Exemplo de caixa box-level</h1>
    <p>Parágrafo também são exemplo de box-level, mas os <a href="#">links são exemplos de caixas inline-level</a> vamos ver como tudo isso funciona.</p>

</body>
</html>
