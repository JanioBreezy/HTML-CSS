<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <h1>Uso de Tabelas Grandes</h1>

    <table>
        
        <thead>
            <TR>
                <th>Estado</th>
                <th>População</th>
            </TR>

        </thead>

        <tbody>
            
            <tr>
                <td>São Paulo</td>
                <td class="num">45 919 049</td>
            </tr>

            <tr>
                <td>Minas Gerais</td>
                <td class="num">21 460 311</td>
            </tr>

            <tr>
                <td> Rio de Janeiro</td>
                <td class="num">17 225 410</td>
            </tr>
        </tbody>
        
        <tfoot>
        <td>Total de Habitantes</td>
        <td class="num"><strong>130.523.819</strong></td>
        </tfoot>
    
    </table>
</body>
</html>
